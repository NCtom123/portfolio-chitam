<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <!-- Smooth Electric Blue to Cyan Gradient (No Purple) -->
    <linearGradient id="cvGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d4ed8" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    
    <!-- Top Glass Gloss Highlight -->
    <linearGradient id="cvGloss" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02" />
    </linearGradient>

    <!-- Subtle Soft Drop Shadow -->
    <filter id="cvShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0284c7" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Document Sheet Body -->
  <rect x="8" y="5" width="32" height="38" rx="6.5" fill="url(#cvGrad)" filter="url(#cvShadow)"/>
  
  <!-- Subtle Glass Highlight Overlay on Top Half -->
  <rect x="9" y="6" width="30" height="18" rx="5.5" fill="url(#cvGloss)" />

  <!-- Outer Glass Stroke Highlight -->
  <rect x="8" y="5" width="32" height="38" rx="6.5" fill="none" stroke="#ffffff" stroke-width="0.9" stroke-opacity="0.35" />

  <!-- Avatar Photo Box -->
  <rect x="13" y="10" width="10" height="10" rx="2.5" fill="#ffffff"/>
  <circle cx="18" cy="14" r="2.5" fill="#0284c7"/>
  <path d="M14.5 18.5 C15 16.8 21 16.8 21.5 18.5" stroke="#0284c7" stroke-width="1.2" stroke-linecap="round" fill="none"/>

  <!-- Resume Text Lines -->
  <rect x="26" y="11" width="8" height="2.5" rx="1.2" fill="#ffffff" opacity="0.95"/>
  <rect x="26" y="16" width="8" height="2.5" rx="1.2" fill="#ffffff" opacity="0.95"/>
  <rect x="13" y="23" width="22" height="2.5" rx="1.2" fill="#ffffff" opacity="0.95"/>
  <rect x="13" y="28" width="18" height="2.5" rx="1.2" fill="#ffffff" opacity="0.88"/>
  <rect x="13" y="33" width="12" height="2.5" rx="1.2" fill="#ffffff" opacity="0.75"/>

  <!-- Verified Checkmark Badge -->
  <circle cx="33" cy="34" r="5.5" fill="#10b981" stroke="#ffffff" stroke-width="1.2"/>
  <path d="M30.8 34 L32.4 35.6 L35.6 32.2" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
